---
# .github/workflows/check-docstrings.yml
name: Check Docstrings

on:
    push:
        branches: [main]
    pull_request:
        branches: ['**']

# Least-privilege default: these workflows only read the repository.
# Any job needing more must opt in explicitly at the job level.
permissions:
  contents: read

jobs:
    check-docstrings:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Set up Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: '3.13'

            - name: Check docstring formatting
              run: python .github/scripts/check_docstrings.py
